              "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates",
              "x-supabase-statement-timeout": "25000" },
            body: JSON.stringify({ ref: refRef.current, data: currentData, updated_at: new Date().toISOString() })
          });

      }
      if (ok) { setLastSaved(new Date().toISOString()); setSaveStatus("saved"); }
      else setSaveStatus("error");

  const parseBDC = async (file) => {
    setBcLoading(true); setBcMsg("");
    try {
      if (!file.type.includes("pdf")) {
        setBcMsg("Format PDF requis");
        setBcLoading(false); return;
      }
      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: ab }).promise;

      // ── Extract items with coordinates from all pages ──────────────────────
      var allItems = [];
      var pageWidths = [];
      for (var pg = 1; pg <= Math.min(pdf.numPages, 4); pg++) {
        var page = await pdf.getPage(pg);
        var vp = page.getViewport({ scale: 1 });
        pageWidths.push(vp.width);
        var tc = await page.getTextContent();
        for (var ti = 0; ti < tc.items.length; ti++) {
          var item = tc.items[ti];
          if (item.str.trim()) {
            allItems.push({ str: item.str.trim(), x: item.transform[4], y: vp.height - item.transform[5], page: pg, pw: vp.width });
          }
        }
      }

      // Sort: page asc, y asc, x asc
      allItems.sort(function(a, b) {
        if (a.page !== b.page) return a.page - b.page;
        if (Math.abs(a.y - b.y) >= 6) return a.y - b.y;
        return a.x - b.x;
      });

      // Group into lines (items within 5px vertically = same line)
      var lineGroups = [];
      for (var ii = 0; ii < allItems.length; ii++) {
        var it = allItems[ii];
        var last = lineGroups[lineGroups.length - 1];
        if (last && it.page === last.page && Math.abs(it.y - last.y) < 5) {
          last.items.push(it);
        } else {
          lineGroups.push({ y: it.y, page: it.page, pw: it.pw, items: [it] });
        }
      }

      // Build line objects with text + min/max x
      var lines = lineGroups.map(function(g) {
        var sorted = g.items.sort(function(a,b){ return a.x - b.x; });
        return {
          text: sorted.map(function(i){ return i.str; }).join(" ").trim(),
          minX: sorted[0].x,
          maxX: sorted[sorted.length-1].x,
          y: g.y,
          page: g.page,
          pw: g.pw,
          items: sorted
        };
      }).filter(function(l){ return l.text; });

      var r = {
        nom: "", adresse: "", manager: "", commande_ref: "",
        panneaux: [], onduleurs: [], batts: [], bornes: [], greenbox: false
      };

      // ── Commande ref ───────────────────────────────────────────────────────
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].text.match(/Commande\s*#\s*(S\d+)/i);
        if (m) { r.commande_ref = m[1]; break; }
      }

      // ── Vendeur ────────────────────────────────────────────────────────────
      for (var i = 0; i < lines.length; i++) {
        if (/^Vendeur\s*:/i.test(lines[i].text)) {
          var same = lines[i].text.replace(/^Vendeur\s*:\s*/i, "").trim();
          var nxt = lines[i+1] ? lines[i+1].text.trim() : "";
          var cand = same || nxt;
          if (cand && !/^We Green/i.test(cand)) {
            // Try exact match first, then partial match
            if (PM_DATA[cand]) {
              r.manager = cand;
            } else {
              // Try matching by first+last name fragments
              var candLower = cand.toLowerCase();
              var matched = Object.keys(PM_DATA).find(function(k) {
                return k.toLowerCase() === candLower ||
                       candLower.indexOf(k.toLowerCase()) >= 0 ||
                       k.toLowerCase().indexOf(candLower) >= 0;
              });
              r.manager = matched || cand;
            }
          }
          break;
        }
      }

      // ── Client extraction ─────────────────────────────────────────────────
      // Find index of "Commande #" line (header ends here)
      var cmdLineIdx = -1;
      for (var i = 0; i < lines.length; i++) {
        if (/Commande\s*#/i.test(lines[i].text)) { cmdLineIdx = i; break; }
      }
      var headerLines = cmdLineIdx >= 0 ? lines.slice(0, cmdLineIdx) : lines.slice(0, 20);

      var hasAddressBlock = headerLines.some(function(l){ return /Adresse de (facturation|livraison|exp)/i.test(l.text); });

      if (hasAddressBlock) {
        var pw = headerLines[0] ? headerLines[0].pw : 595;
        var rightThreshold = pw * 0.52;

        // nom = top-right contact block (client name)
        var rightBlock = [];
        for (var i = 0; i < headerLines.length; i++) {
          var ln = headerLines[i];
          if (ln.minX > rightThreshold && !/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE)/i.test(ln.text)) {
            rightBlock.push(ln.text);
          }
        }
        var filteredRight = rightBlock.filter(function(tx){ return !/^(TVA|tel|fax|\+\d|BE\d{9})/i.test(tx); });
        if (filteredRight.length >= 1 && !/^We Green/i.test(filteredRight[0])) {
          r.nom = filteredRight[0];
        }

        // adresse chantier = shipping address block (left column only)
        var shipLabelIdx = -1;
        for (var i = 0; i < headerLines.length; i++) {
          var lt = headerLines[i].text;
          if (/Adresse.{1,5}exp.{1,10}dition/i.test(lt)) { shipLabelIdx = i; break; }
        }
        if (shipLabelIdx < 0) {
          for (var i = 0; i < headerLines.length; i++) {
            if (/Adresse de facturation/i.test(headerLines[i].text)) { shipLabelIdx = i; break; }
          }
        }
        var shipLines = [];
        if (shipLabelIdx >= 0) {
          for (var i = shipLabelIdx + 1; i < headerLines.length; i++) {
            var ln2 = headerLines[i];
            if (ln2.minX > rightThreshold) continue;
            var t2 = ln2.text;
            if (/^(Belgique|France|Pays-Bas)$/i.test(t2)) break;
            if (/^Adresse\s+de/i.test(t2)) break;
            if (/^(We Green|Ikaroslaan|Zaventem|Belgium|\+\d)/i.test(t2)) continue;
            shipLines.push(t2);
          }
          if (shipLines.length) {
            var addrLines = shipLines;
            if (addrLines.length > 1 && !/^\d|^Rue|^Avenue|^Av\.|^Chauss|^Bd\b|^Boulevard|^Place|^Sq\b|^Drev|^All.e|^Impasse/i.test(addrLines[0])) {
              addrLines = addrLines.slice(1);
            }
            r.adresse = addrLines.filter(function(t3){ return !/^(TVA|Belgi)/i.test(t3); }).join(", ");
          }
        }
        if (!r.nom && shipLines.length) r.nom = shipLines[0];
      } else {
        // Simple BDC: client block is in the RIGHT column (high X) of the header
        var pw2 = headerLines[0] ? headerLines[0].pw : 595;
        var rightThresh2 = pw2 * 0.50;
        var clientBlock = [];
        for (var i = 0; i < headerLines.length; i++) {
          var ln = headerLines[i];
          // Only right-column items
          if (ln.minX > rightThresh2) {
            var t = ln.text;
            if (/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE|02 476|IBAN|Energy Solutions)/i.test(t)) continue;
            clientBlock.push(t);
          }
        }
        // Fallback: if nothing found in right column, try all non-WGE lines
        if (clientBlock.length === 0) {
          for (var i = 0; i < headerLines.length; i++) {
            var t = headerLines[i].text;
            if (/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE|02 476|IBAN|Energy Solutions)/i.test(t)) continue;
            clientBlock.push(t);
          }
        }
        // Remove trailing Belgique/France
        while (clientBlock.length && /^(Belgique|France|TVA)/i.test(clientBlock[clientBlock.length-1])) clientBlock.pop();
        if (clientBlock.length >= 1) r.nom = clientBlock[0];
        if (clientBlock.length >= 2) r.adresse = clientBlock.slice(1).join(", ");
      }

      // ── Scan product lines ─────────────────────────────────────────────────
      // Helper: extract qty from line text (first integer >= 1 followed by ,00 or .00)
      function extractQty(text) {
        var m = text.match(/\b(\d+)[,.]0+\b/g);
        if (!m) return 0;
        for (var q = 0; q < m.length; q++) {
          var n = parseInt(m[q]);
          if (n >= 1 && n <= 9999) return n;
        }
        return 0;
      }

      // Helper: extract wattage from text
      function extractWc(text) {
        var m = text.match(/\b(\d{3,4})[Ww](?:c|att|p)?(?:\s|$|-|\/)/);
        if (m) return m[1];
        // From model like "A445", "54HL4M-BDV 515", "460W"
        m = text.match(/\b(\d{3,4})[Ww]\b/);
        if (m) return m[1];
        // Model number like "-A445-" or " 515 "
        m = text.match(/[-\s]A?(\d{3,4})[-\s]/);
        if (m && parseInt(m[1]) >= 100 && parseInt(m[1]) <= 999) return m[1];
        return "";
      }

      for (var li = 0; li < lines.length; li++) {
        var t = lines[li].text;

        // Panneaux (also matches SKU prefix like [ODA450-24V-MHDBRz] Panneaux -)
        if (/^(?:\[[^\]]+\]\s*)?Panneaux\s*[-]\s*/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/^(?:\[[^\]]+\]\s*)?Panneaux\s*[-]\s*(.+)/i);
          if (nameMatch) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").replace(/\s*[-]\s*(Full Black|Neostar\S*|Half[- ]Cell)\s*$/, "").trim();
            var wc = extractWc(t);
            r.panneaux.push({ name: name, qty: qty, wc: wc });
          }
        }

        // Onduleurs (skip Optimiseur/Optimizer)
        if (/Onduleur\s*[-]/i.test(t) && !/Optimis[e|eu]ur|Optimizer/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/(?:\[[^\]]+\]\s*)?Onduleur\s*[-]\s*(.+)/i);
          if (nameMatch && qty > 0) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").replace(/\s*[-]\s*(Low Voltage|Three Phase|Hybrid|Mono\b|MONO\b|Single|TRI\b).*/i, "").trim();
            r.onduleurs.push({ type: name, qty: qty });
          }
        }
        // Onduleurs without "Onduleur -" prefix (like "Onduleur Deye SUN...")
        if (/^Onduleur\s+(?!.*Optimis)/i.test(t) && !/-\s*/i.test(t.substring(0,15))) {
          var qty = extractQty(t);
          var nameMatch = t.match(/^Onduleur\s+(.+)/i);
          if (nameMatch && qty > 0) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim();
            r.onduleurs.push({ type: name, qty: qty });
          }
        }

        // Batteries
        if (/^(?:\[[^\]]+\]\s*)?Batterie\s*[-]/i.test(t) && !/Chargeur|Power Module|recyclage/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/Batterie\s*[-]\s*(.+)/i);
          if (nameMatch) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim();
            var kwhM = t.match(/\b(\d+(?:[,.]\d+)?)\s*kWh/i) || nameMatch[1].match(/\b(\d+(?:[,.]\d+)?)\s*[kK][wW][hH]/i);
            var kwh = kwhM ? kwhM[1].replace(",",".") : "";
            r.batts.push({ name: name, qty: qty, kwh: kwh });
          }
        }

        // Bornes
        if (/^Borne\s/i.test(t)) {
          var qty = extractQty(t);
          if (qty > 0) {
            var nameMatch = t.match(/^Borne\s+[-\s]?\s*(.+)/i);
            var name = nameMatch ? nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim() : t;
            r.bornes.push({ type: name, qty: qty });
          }
        }

        // Greenbox
        if (/^Greenbox\s*(?:\d+[,.]|$)/i.test(t)) {
          r.greenbox = true;
        }
      }

      // ── Apply to state ─────────────────────────────────────────────────────
      if (r.nom || r.adresse) {
        setClient(function(p){ return Object.assign({}, p, { nom: r.nom || p.nom, adresse: r.adresse || p.adresse }); });
      }
      if (r.manager) {
        if (PM_DATA[r.manager]) {
          setWeGreen(function(p){ return Object.assign({}, p, { manager: r.manager, tel: PM_DATA[r.manager].tel, email: PM_DATA[r.manager].email }); });
        } else {
          setWeGreen(function(p){ return Object.assign({}, p, { manager: r.manager }); });
        }
      }

      setSites(function(prev) {
        var arr = JSON.parse(JSON.stringify(prev));
        var next = arr[0].pvInstallations[0].tech;

        // Panneaux: use first with highest qty
        var mainPan = null;
        for (var i = 0; i < r.panneaux.length; i++) {
          if (!mainPan || r.panneaux[i].qty > mainPan.qty) mainPan = r.panneaux[i];
        }
        if (mainPan) {
          next.panneaux.type = mainPan.name;
          next.panneaux.nbr = String(mainPan.qty || "");
          if (mainPan.wc && mainPan.qty) next.panneaux.kWc = (parseFloat(mainPan.qty) * parseFloat(mainPan.wc) / 1000).toFixed(2);
          else if (mainPan.wc === "" && mainPan.qty) {
            // Try extracting wc from name
            var wm = mainPan.name.match(/\b(\d{3,4})[Ww]/);
            if (wm) next.panneaux.kWc = (parseFloat(mainPan.qty) * parseFloat(wm[1]) / 1000).toFixed(2);
          }
        }

        // Onduleurs
        if (r.onduleurs.length > 0) {
          next.onduleurs = r.onduleurs.map(function(o){ return { type: o.type, kva: "" }; });
        }

        // Batterie
        var hasRealBatt = r.batts.some(function(b){ return b.qty > 0; });
        if (r.batts.length > 0) {
          var mainBatt = r.batts[0];
          // Find first with kWh info
          for (var i = 0; i < r.batts.length; i++) {
            if (r.batts[i].kwh) { mainBatt = r.batts[i]; break; }
          }
          if (hasRealBatt) {
            next.batterie.inclus = "OUI";
            if (mainBatt.kwh) next.batterie.kwh = mainBatt.kwh;
            if (mainBatt.name) next.batterie.type = mainBatt.name;
            // qty from first with qty > 0
            for (var i = 0; i < r.batts.length; i++) {
              if (r.batts[i].qty > 0) { next.batterie.qty = String(r.batts[i].qty); break; }
            }
          }
        }

        // Borne
        if (r.bornes.length > 0) {
          next.borne.inclus = "OUI";
          next.borne.type = r.bornes[0].type;
          next.borne.qty = String(r.bornes[0].qty);
        }

        // Greenbox
        if (r.greenbox) next.greenbox = "OUI";

        arr[0].pvInstallations[0].tech = next;
        return arr;
      });

      var found = [
        r.nom && "client",
        r.adresse && "adresse",
        r.panneaux.some(function(p){ return p.qty > 0; }) && "panneaux (" + r.panneaux.reduce(function(s,p){ return s + p.qty; }, 0) + " pcs)",
        r.onduleurs.length && "onduleurs",
        r.batts.some(function(b){ return b.kwh; }) && "batterie",
        r.bornes.length && "borne",
        r.greenbox && "greenbox",
        r.manager && "PM"
      ].filter(Boolean);

      setBcMsg(found.length > 0
        ? "Extrait : " + found.join(" · ") + (r.commande_ref ? "  [" + r.commande_ref + "]" : "")
        : "Aucune donnee reconnue");
    } catch (e) {
      setBcMsg("Erreur : " + e.message);
    }
    setBcLoading(false);
  };

          var mainBatt = batts[0];
          for (var i = 0; i < batts.length; i++) { if (batts[i].kwh) { mainBatt = batts[i]; break; } }
          next.batterie.inclus = "OUI";
          if (mainBatt.kwh) next.batterie.kwh = mainBatt.kwh;
          if (mainBatt.name) next.batterie.type = mainBatt.name;
          for (var j = 0; j < batts.length; j++) { if (batts[j].qty > 0) { next.batterie.qty = String(batts[j].qty); break; } }
        }
        if ((r.bornes || []).length > 0) {

        (r.onduleurs || []).length && "onduleurs",
        (r.batts || []).some(function(b){ return b.kwh; }) && "batterie",
        (r.bornes || []).length && "borne",
        r.greenbox && "greenbox",
        r.manager && "PM"
      ].filter(Boolean);
      setOdooMsg(found.length > 0 ? ("✓ Odoo : " + found.join(" · ") + (r.name ? "  [" + r.name + "]" : "")) : "Commande trouvée mais aucune donnée exploitable.");
    } catch(e) {
      console.error("refreshFromOdoo:", e);
      setOdooMsg("Erreur réseau lors de l'appel Odoo.");
    }

  };


        const extractCalepinage = async (file) => {

        });

        applyCalepinage(url, "✓ Image chargée");

      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await file.arrayBuffer();

      // Read all pages text first
      const pageTexts = [];
      for (let i = 1; i <= pdf.numPages; i++) {

      }
      const allText = pageTexts.join(" ");

      // Detect report type

      // HelioScope/We Green web format → "Design Render" page
      // Archelios → "Illustrations du projet" page
      const isHelioScope = /helioscope|aurora solar|detailed layout|design render/i.test(allText);
      const isArchelios = /archelios|illustrations du projet/i.test(allText);
      // "Annual Production Report" without explicit brand = likely HelioScope web export
      const isAnnualProductionReport = /annual production report/i.test(allText);

      let targetPage = pdf.numPages; // default: last page

      if (isHelioScope || isAnnualProductionReport) {
        // Priority 1: "Detailed Layout" (Aurora Solar)
        // Priority 2: "Design Render" (HelioScope web / We Green format)
        let foundLayout = false;
        for (let i = 1; i <= pdf.numPages; i++) {
          if (/detailed layout/i.test(pageTexts[i-1])) { targetPage = i; foundLayout = true; break; }
        }
        if (!foundLayout) {
          for (let i = 1; i <= pdf.numPages; i++) {
            if (/design render/i.test(pageTexts[i-1])) { targetPage = i; break; }
          }
        }
      } else if (isArchelios) {
        // Archelios: find "Illustrations du projet" page
        for (let i = 1; i <= pdf.numPages; i++) {
          if (/illustrations du projet/i.test(pageTexts[i-1])) { targetPage = i; break; }
        }
      } else {
        // Generic: score pages, prefer layout/illustration pages, skip map pages
        let bestScore = -999; let bestPage = pdf.numPages;
        for (let i = 1; i <= pdf.numPages; i++) {
          const txt = pageTexts[i-1];
          let score = 0;
          if (/illustration|detailed layout|calepinage|layout plan|design render/.test(txt)) score += 15;
          if (/toiture|roof|panneaux|string|mppt/.test(txt)) score += 5;
          if (/google|maps?|satellite|localisation|location|météo|meteo|irradiation/.test(txt)) score -= 20;
          if (score >= bestScore) { bestScore = score; bestPage = i; }
        }
        targetPage = bestPage;
      }

      // Render target page at high resolution
      const page = await pdf.getPage(targetPage);
      const viewport = page.getViewport({ scale: 3.5 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const calUrl = canvas.toDataURL("image/jpeg", 0.95);
      const type = isArchelios ? "Archelios" : (isHelioScope || isAnnualProductionReport) ? "Hélioscope" : "PDF";
      applyCalepinage(calUrl, "✓ " + type + " — page " + targetPage + "/" + pdf.numPages);

    } catch (e) {
      setCalepinage({ image: null, loading: false, msg: "Erreur : " + e.message });
    }
  };

                    var k = item[0], lbl = item[1];
                    return (
                      <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <span style={{ fontSize: 13 }}>{lbl}</span>
                        <Toggle value={logistique[k]} onChange={function(v){ setLogistique(function(p){ return Object.assign({}, p, { [k]: v }); }); }} />
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <Field label="Hauteur corniche" value={logistique.hauteurCorniche} onChange={function(v){ setLogistique(function(p){ return Object.assign({}, p, { hauteurCorniche: v }); }); }} type="number" unit="m" />
                  <Field label="Hauteur toit plat" value={logistique.hauteurToitPlat} onChange={function(v){ setLogistique(function(p){ return Object.assign({}, p, { hauteurToitPlat: v }); }); }} type="number" unit="m" />
                </div>
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: MUTED, marginBottom: 7 }}>Accès à la toiture</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["Côté rue", "Côté jardin", "Autre"].map(function(a) {
                    return <Chip key={a} label={a} selected={logistique.acces === a} onClick={function(){ setLogistique(function(p){ return Object.assign({}, p, { acces: p.acces === a ? null : a }); }); }} />;
                  })}
                </div>
                {logistique.acces === "Autre" && (
                  <input value={logistique.autreAcces} onChange={function(e){ setLogistique(function(p){ return Object.assign({}, p, { autreAcces: e.target.value }); }); }} placeholder="Préciser…" style={{ marginTop: 8, width: "100%" }} />
                )}
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: MUTED, marginBottom: 7 }}>Équipements de levage / manutention</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {[["lift","LIFT"],["nacelle","Nacelle"],["manitou","Manitou"],["grue","Grue"]].map(function(item) {
                    var k = item[0], lbl = item[1];
                    return (
                      <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 10px", background: logistique[k] === "OUI" ? GREEN_LIGHT : BG, borderRadius: 6, border: "1px solid " + (logistique[k] === "OUI" ? GREEN_MID : BORDER) }}>
                        <span style={{ fontSize: 13, fontWeight: logistique[k] === "OUI" ? 600 : 400 }}>{lbl}</span>
                        <Toggle value={logistique[k]} onChange={function(v){ setLogistique(function(p){ return Object.assign({}, p, { [k]: v }); }); }} />
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* ── 3. Sites (électrique + PV + BR) ── */}
          {sites.map(function(site, siteIdx) {
            return (
              <div key={siteIdx}>
                {/* Site banner (si plusieurs sites) */}
                {sites.length > 1 && (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "16px 0 8px" }}>
                    <div style={{ background: "#555", color: "#fff", borderRadius: 8, padding: "5px 18px", fontWeight: 700, fontSize: 14 }}>
                      📍 Site {siteIdx + 1}
                    </div>
                    {sites.length > 1 && (
                      <button onClick={function(){ removeSite(siteIdx); }} style={{ background: "none", border: "1px solid #e74c3c", color: "#e74c3c", borderRadius: 6, padding: "3px 10px", fontSize: 12, cursor: "pointer" }}>
                        Supprimer ce site
                      </button>
                    )}
                  </div>
                )}

                {/* Bloc électrique — 1x par site */}
                <SiteElectricalBlock
                  electrical={site.electrical}
                  onSet={function(path, val){ setSiteE(siteIdx, path, val); }}
                />

                {/* Installations PV du site */}
                {site.pvInstallations.map(function(inst, pvIdx) {
                  return React.createElement(InstallationBlock, {
                    key: pvIdx, tech: inst.tech, strings: inst.strings,
                    instIdx: pvIdx, total: site.pvInstallations.length,
                    onSetT: function(pvIdx2, path, val){ setT(siteIdx, pvIdx2, path, val); },
                    onSetTech: function(pvIdx2, upd){ setInstTech(siteIdx, pvIdx2, upd); },
                    onAddString: function(pvIdx2){ addString(siteIdx, pvIdx2); },
                    onUpdString: function(pvIdx2, si, row){ updString(siteIdx, pvIdx2, si, row); },
                    onDelString: function(pvIdx2, si){ delString(siteIdx, pvIdx2, si); },
                    onRemove: function(pvIdx2){ removePVInst(siteIdx, pvIdx2); }
                  });
                })}

                {/* Installations BR du site */}
                {site.brInstallations.map(function(brInst, brIdx) {
                  return React.createElement(BRInstallationBlock, {
                    key: brIdx, inst: brInst, instIdx: brIdx, total: site.brInstallations.length,
                    onSet: function(brIdx2, path, val){ setBRInst(siteIdx, brIdx2, path, val); },
                    onRemove: function(brIdx2){ removeBRInst(siteIdx, brIdx2); }
                  });
                })}

                {/* Boutons ajouter PV / BR pour ce site */}
                <div style={{ display: "flex", justifyContent: "center", gap: 12, margin: "12px 0 4px", flexWrap: "wrap" }}>
                  <button onClick={function(){ addPVInst(siteIdx); }} style={{ background: GREEN_LIGHT, color: GREEN, border: "1.5px dashed " + GREEN_MID, borderRadius: 8, padding: "8px 24px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                    ➕ Ajouter une installation PV
                  </button>
                  <button onClick={function(){ addBRInst(siteIdx); }} style={{ background: "#eaf4fd", color: "#2980b9", border: "1.5px dashed #bde0f5", borderRadius: 8, padding: "8px 24px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                    🔌 Ajouter une installation BR
                  </button>
                </div>
              </div>
            );
          })}

          {/* Ajouter un site */}
          <div style={{ display: "flex", justifyContent: "center", margin: "4px 0 12px" }}>
            <button onClick={addSite} style={{ background: "#f5f5f0", color: "#555", border: "1.5px dashed #bbb", borderRadius: 8, padding: "7px 24px", fontSize: 12, fontWeight: 500, cursor: "pointer" }}>
              📍 Ajouter un site (2ème installation électrique)
            </button>
          </div>

          {/* ── 4. Calepinage ── */}
          <div style={CARD}>
            <div style={SH}><span>📐</span> Calepinage <span style={{ fontSize: 10, fontWeight: 400, color: MUTED, textTransform: "none", letterSpacing: 0, marginLeft: 4 }}>(image de garde PDF)</span></div>
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 10 }}>Archelios, Hélioscope, ou capture du design PV en toiture — affichée en page de garde.</div>
            <div style={{ display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap" }}>
              <div
                onDragOver={e => { e.preventDefault(); }}
                onDrop={e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) extractCalepinage(f); }}
                onClick={() => { const i = document.createElement("input"); i.type = "file"; i.accept = ".pdf,image/*,.heic,.heif"; i.onchange = e => e.target.files && e.target.files[0] && extractCalepinage(e.target.files[0]); i.click(); }}
                style={{ border: "1.5px dashed " + BORDER, background: BG, borderRadius: 8, padding: 12, minWidth: 180, minHeight: 120, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, flex: "0 0 auto" }}>
                {calepinage.loading
                  ? <div style={{ fontSize: 13, color: GREEN }}>Extraction…</div>
                  : <><div style={{ fontSize: 26 }}>🗺️</div><div style={{ fontSize: 12, fontWeight: 500 }}>PDF ou image</div><div style={{ fontSize: 11, color: MUTED, textAlign: "center" }}>Archelios / Hélioscope<br/>ou capture d'écran</div></>
                }
                {calepinage.msg && <div style={{ fontSize: 11, color: GREEN, fontWeight: 600, marginTop: 4 }}>{calepinage.msg}</div>}
              </div>
              {calepinage.image && (
                <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
                  <img src={calepinage.image} alt="calepinage" style={{ width: "100%", borderRadius: 6, display: "block" }} />
                  <button onClick={() => setCalepinage({ image: null, loading: false, msg: "" })} style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,0.5)", color: WHITE, border: "none", borderRadius: 4, cursor: "pointer", fontSize: 14, padding: "2px 6px" }}>×</button>
                </div>
              )}
            </div>
          </div>

          {/* ── 5. Note PM + Notes vocales ── */}
          <div style={CARD}>
            <div style={SH}><span>📝</span> Note du Project Manager</div>
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 8 }}>Remarques internes, instructions pour les monteurs, observations de visite…</div>
            <textarea
              value={pmNote}
              onChange={e => setPmNote(e.target.value)}
              placeholder="Saisir une note (visible dans le PDF)…"
              rows={4}
              style={{ width: "100%", fontSize: 13, resize: "vertical", boxSizing: "border-box", borderRadius: 6, border: "1px solid " + BORDER, padding: "8px 10px", fontFamily: "inherit" }}
            />
            <VoiceNoteBlock
              notes={voiceNotes}
              onChange={setVoiceNotes}
              chantierRef={ref}
              chantierEntity={entity}
            />
          </div>

          {/* ── 6. Photos ── */}
          <div style={CARD}>
            <div style={SH}><span>📷</span> Photos de chantier</div>

            {/* DC */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <div style={{ height: 3, width: 18, background: "#3498db", borderRadius: 2 }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: "#2980b9", textTransform: "uppercase", letterSpacing: "0.07em" }}>Photos DC — qualité standard</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px, 1fr))", gap: 12 }}>
                {getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return ["vue_generale","toiture","cablage","strings_design","onduleur"].indexOf(c.key) >= 0; }).map(function({ key, label, hasNote, hiRes }) {
                  return <PhotoZone key={key} catKey={key} label={label} items={photos[key] || []} onAdd={function(items) { return addPhotos(key, items); }} onDelete={function(idx) { return deletePhoto(key, idx); }} onUpdate={function(idx, url, dUrl, tObjs) { return updatePhoto(key, idx, url, dUrl, tObjs); }} onReorder={function(from, to) { return reorderPhoto(key, from, to); }} onReceiveCross={function(fromKey, fromIdx) { movePhoto(fromKey, fromIdx, key); }} onMoveTo={function(fromIdx, toKey) { movePhoto(key, fromIdx, toKey); }} allSections={getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return c.key !== key && !c._legacy; }).map(function(c){ return { key: c.key, label: c.label }; })} hasNote={!!hasNote} note={key === "td" ? tdNote : key === "schema_elec" ? schemaNote : ""} onNoteChange={function(v) { return key === "td" ? setTdNote(v) : setSchemaNote(v); }} hiRes={!!hiRes} />;
                })}
              </div>
            </div>

            {/* AC */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <div style={{ height: 3, width: 18, background: "#e74c3c", borderRadius: 2 }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: "#c0392b", textTransform: "uppercase", letterSpacing: "0.07em" }}>Photos AC — haute résolution</span>
                <span style={{ fontSize: 10, fontWeight: 600, color: "#c0392b", background: "#fdecea", padding: "1px 6px", borderRadius: 4 }}>HD</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px, 1fr))", gap: 12 }}>
                {getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return ["compteur","tgbt","td","schema_elec"].indexOf(c.key) >= 0; }).map(function({ key, label, hasNote, hiRes }) {
                  return <PhotoZone key={key} catKey={key} label={label} items={photos[key] || []} onAdd={function(items) { return addPhotos(key, items); }} onDelete={function(idx) { return deletePhoto(key, idx); }} onUpdate={function(idx, url, dUrl, tObjs) { return updatePhoto(key, idx, url, dUrl, tObjs); }} onReorder={function(from, to) { return reorderPhoto(key, from, to); }} onReceiveCross={function(fromKey, fromIdx) { movePhoto(fromKey, fromIdx, key); }} onMoveTo={function(fromIdx, toKey) { movePhoto(key, fromIdx, toKey); }} allSections={getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return c.key !== key && !c._legacy; }).map(function(c){ return { key: c.key, label: c.label }; })} hasNote={!!hasNote} note={key === "td" ? tdNote : key === "schema_elec" ? schemaNote : ""} onNoteChange={function(v) { return key === "td" ? setTdNote(v) : setSchemaNote(v); }} hiRes={!!hiRes} />;
                })}
              </div>
            </div>

            {/* Extra */}
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <div style={{ height: 3, width: 18, background: "#999", borderRadius: 2 }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: "#555", textTransform: "uppercase", letterSpacing: "0.07em" }}>Photos supplémentaires / à reclasser</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px, 1fr))", gap: 12 }}>
                {getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return ["extra"].indexOf(c.key) >= 0; }).map(function({ key, label, hasNote, hiRes }) {
                  return <PhotoZone key={key} catKey={key} label={label} items={photos[key] || []} onAdd={function(items) { return addPhotos(key, items); }} onDelete={function(idx) { return deletePhoto(key, idx); }} onUpdate={function(idx, url, dUrl, tObjs) { return updatePhoto(key, idx, url, dUrl, tObjs); }} onReorder={function(from, to) { return reorderPhoto(key, from, to); }} onReceiveCross={function(fromKey, fromIdx) { movePhoto(fromKey, fromIdx, key); }} onMoveTo={function(fromIdx, toKey) { movePhoto(key, fromIdx, toKey); }} allSections={getPhotoCats(sites.some(function(s){ return s.brInstallations && s.brInstallations.length > 0; }) ? "pvbr" : "pv").filter(function(c){ return c.key !== key && !c._legacy; }).map(function(c){ return { key: c.key, label: c.label }; })} hasNote={!!hasNote} note={key === "td" ? tdNote : key === "schema_elec" ? schemaNote : ""} onNoteChange={function(v) { return key === "td" ? setTdNote(v) : setSchemaNote(v); }} hiRes={!!hiRes} />;
                })}
              </div>
            </div>
          </div>
        </>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
