function AnnotationModal({ imageUrl, onSave, onClose }) {
  var canvasRef = useRef();
  var containerRef = useRef();
  var [tool, setTool] = useState("free");
  var [color, setColor] = useState("#e74c3c");
  var [thickness, setThickness] = useState(4);
  var [history, setHistory] = useState([]);
  var drawing = useRef(false);
  var startPos = useRef({ x: 0, y: 0 });
  var snapshot = useRef(null);
  // Pinch-to-zoom state
  var zoom = useRef(1);
  var panOffset = useRef({ x: 0, y: 0 });
  var lastPinchDist = useRef(null);
  var lastPanPos = useRef(null);
  var isPinching = useRef(false);
  var [zoomLevel, setZoomLevel] = useState(1);

  var COLORS = ["#e74c3c","#27ae60","#2980b9","#f39c12","#ffffff","#1a1a1a"];
  var TOOLS = [["free","✏️ Libre"],["line","📏 Droit"],["eraser","🧹 Gomme"]];

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var img = new Image();
    img.onload = function() {
      var maxW = window.innerWidth * 0.92;
      var maxH = window.innerHeight * 0.65;
      var scale = Math.min(maxW / img.width, maxH / img.height, 1);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      setHistory([ctx.getImageData(0, 0, canvas.width, canvas.height)]);
    };
    img.src = imageUrl;
  }, []);

  function getPos(e) {
    var canvas = canvasRef.current;
    var rect = canvas.getBoundingClientRect();
    // Account for zoom/pan transform applied to container
    var scaleX = canvas.width / (rect.width);
    var scaleY = canvas.height / (rect.height);
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function onStart(e) {
    e.preventDefault();
    if (e.touches && e.touches.length === 2) { isPinching.current = true; return; }
    if (isPinching.current) return;
    var canvas = canvasRef.current;
    var ctx = canvas.getContext("2d");
    var pos = getPos(e);
    drawing.current = true;
    startPos.current = pos;
    snapshot.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function onMove(e) {
    e.preventDefault();
    // Handle pinch zoom
    if (e.touches && e.touches.length === 2) {
      isPinching.current = true;
      drawing.current = false;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (lastPinchDist.current !== null) {
        var delta = dist / lastPinchDist.current;
        zoom.current = Math.min(Math.max(zoom.current * delta, 1), 4);
        setZoomLevel(Math.round(zoom.current * 100));
        if (containerRef.current) {
          containerRef.current.style.transform = "scale(" + zoom.current + ")";
          containerRef.current.style.transformOrigin = "center center";
        }
      }
      lastPinchDist.current = dist;
      return;
    }
    lastPinchDist.current = null;
    if (!drawing.current) return;
    var canvas = canvasRef.current;
    var ctx = canvas.getContext("2d");
    var pos = getPos(e);
    ctx.lineWidth = tool === "eraser" ? thickness * 6 : thickness;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, thickness * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    } else if (tool === "free") {
      ctx.strokeStyle = color;
      ctx.globalCompositeOperation = "source-over";
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } else if (tool === "line") {
      ctx.strokeStyle = color;
      ctx.putImageData(snapshot.current, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.moveTo(startPos.current.x, startPos.current.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
  }

  function onEnd(e) {
    if (e.touches && e.touches.length < 2) { isPinching.current = false; lastPinchDist.current = null; }
    if (!drawing.current) return;
    drawing.current = false;
    var canvas = canvasRef.current;
    var ctx = canvas.getContext("2d");
    setHistory(function(prev) { return prev.concat([ctx.getImageData(0, 0, canvas.width, canvas.height)]); });
  }

  function undo() {
    if (history.length <= 1) return;
    var newHist = history.slice(0, -1);
    setHistory(newHist);
    var canvas = canvasRef.current;
    var ctx = canvas.getContext("2d");
    ctx.putImageData(newHist[newHist.length - 1], 0, 0);
  }

  function resetZoom() {
    zoom.current = 1;
    setZoomLevel(100);
    if (containerRef.current) { containerRef.current.style.transform = "scale(1)"; }
  }

  function save() {
    var canvas = canvasRef.current;
    var out = document.createElement("canvas");
    out.width = canvas.width; out.height = canvas.height;
    var ctx2 = out.getContext("2d");
    ctx2.fillStyle = "#fff";
    ctx2.fillRect(0, 0, out.width, out.height);
    ctx2.drawImage(canvas, 0, 0);
    onSave(out.toDataURL("image/jpeg", 0.92));
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.95)", zIndex: 9999, display: "flex", flexDirection: "column", alignItems: "center", overflow: "hidden", touchAction: "none" }}>
      {/* Toolbar */}
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", justifyContent: "center", padding: "8px 10px", background: "#1a1a1a", width: "100%", boxSizing: "border-box" }}>
        {TOOLS.map(function(t) { return (
          <button key={t[0]} onClick={function() { setTool(t[0]); }}
            style={{ padding: "7px 12px", borderRadius: 8, border: "none", background: tool === t[0] ? GREEN : "#333", color: "#fff", fontSize: 13, cursor: "pointer", fontWeight: tool === t[0] ? 700 : 400 }}>
            {t[1]}
          </button>
        ); })}
        <div style={{ width: 1, height: 28, background: "#444" }} />
        {COLORS.map(function(col) { return (
          <div key={col} onClick={function() { setColor(col); setTool("free"); }}
            style={{ width: 26, height: 26, borderRadius: "50%", background: col, border: color === col && tool !== "eraser" ? "3px solid #fff" : "2px solid #555", cursor: "pointer", flexShrink: 0 }} />
        ); })}
        <div style={{ width: 1, height: 28, background: "#444" }} />
        {[2,4,8].map(function(t) { return (
          <div key={t} onClick={function() { setThickness(t); }}
            style={{ width: t * 3 + 10, height: t * 3 + 10, minWidth: 12, minHeight: 12, borderRadius: "50%", background: thickness === t ? "#fff" : "#555", cursor: "pointer", flexShrink: 0 }} />
        ); })}
        <div style={{ width: 1, height: 28, background: "#444" }} />
        <button onClick={undo} style={{ padding: "7px 10px", borderRadius: 8, border: "none", background: "#333", color: "#fff", fontSize: 13, cursor: "pointer" }}>↩</button>
        {zoomLevel > 100 && <button onClick={resetZoom} style={{ padding: "7px 10px", borderRadius: 8, border: "none", background: "#555", color: "#fff", fontSize: 12, cursor: "pointer" }}>🔍 {zoomLevel}% ✕</button>}
        <button onClick={save} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: GREEN, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>✓ Sauver</button>
        <button onClick={onClose} style={{ padding: "7px 10px", borderRadius: 8, border: "none", background: "#555", color: "#fff", fontSize: 13, cursor: "pointer" }}>✕</button>
      </div>
      {/* Legend */}
      <div style={{ display: "flex", gap: 14, alignItems: "center", padding: "5px 10px", background: "#111", fontSize: 12, color: "#ccc", flexWrap: "wrap", justifyContent: "center", width: "100%", boxSizing: "border-box" }}>
        <span style={{ color: "#888", fontWeight: 600 }}>Légende :</span>
        {[["#e74c3c","Câble DC"],["#27ae60","Câble AC"],["#2980b9","Onduleur"],["#f39c12","Borne"]].map(function(item) { return (
          <span key={item[0]} style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 11, height: 11, borderRadius: "50%", background: item[0], display: "inline-block" }} />
            {item[1]}
          </span>
        ); })}
        <span style={{ color: "#666", fontSize: 11 }}>Pincer pour zoomer</span>
      </div>
      {/* Canvas container with zoom */}
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", width: "100%", position: "relative" }}>
        <div ref={containerRef} style={{ transition: "transform 0.05s", transformOrigin: "center center" }}>
          <canvas ref={canvasRef}
            onMouseDown={onStart} onMouseMove={onMove} onMouseUp={onEnd} onMouseLeave={onEnd}
            onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
            style={{ cursor: tool === "eraser" ? "cell" : "crosshair", borderRadius: 6, touchAction: "none", display: "block", maxWidth: "92vw" }} />
        </div>
      </div>
    </div>
  );
}

function PhotoZone({ label, items, onAdd, onDelete, onUpdate, onReorder, hasNote, note, onNoteChange, hiRes }) {
  const [drag, setDrag] = useState(false);
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const [annotating, setAnnotating] = useState(null); // index of photo being annotated
  const [preview, setPreview] = useState(null); // url of photo to preview full-screen
  const refFile = useRef();
  const refCamera = useRef();
  const zoneRef = useRef();

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // hiRes=true → 1800px max, qualité 0.88 (tableaux, schémas, disjoncteurs)
  // hiRes=false → 1000px max, qualité 0.72 (photos générales)
  const compressImg = function(blob, hiRes) { return new Promise(function(res) {
    const img = new Image();
    const objUrl = URL.createObjectURL(blob);
    img.onload = function() {
      const MAX = hiRes ? 1800 : 1000;
      const QUALITY = hiRes ? 0.88 : 0.72;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
      else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(objUrl);
      res(canvas.toDataURL("image/jpeg", QUALITY));
    };
    img.onerror = function() { URL.revokeObjectURL(objUrl); res(null); };
    img.src = objUrl;
  }); };

  const handleFiles = async function(files) {
    const arr = Array.from(files).filter(function(f) { return f.type.startsWith("image/") || f.type === "application/pdf"; });
    const result = [];
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      const url = f.type.startsWith("image/") ? await compressImg(f, hiRes) : null;
      result.push({ name: f.name, url: url, type: f.type });
    }
    onAdd(result);
  };

  const handlePaste = async function(e) {
    const items2 = Array.from((e.clipboardData && e.clipboardData.items) || []);
    const imageItems = items2.filter(function(i) { return i.type.startsWith("image/"); });
    if (imageItems.length === 0) return;
    e.preventDefault();
    const result = [];
    for (let i = 0; i < imageItems.length; i++) {
      const blob = imageItems[i].getAsFile();
      const url = await compressImg(blob, hiRes);
      result.push({ name: "colle_" + Date.now() + ".jpg", url: url, type: blob.type });
    }
    onAdd(result);
  };

  const handleDragStart = function(i) { setDragIdx(i); };
  const handleDragOver = function(e, i) { e.preventDefault(); setOverIdx(i); };
  const handleDrop = function(e, i) {
    e.preventDefault();
    if (dragIdx !== null && dragIdx !== i) onReorder(dragIdx, i);
    setDragIdx(null); setOverIdx(null);
  };

  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ ...LBL, cursor: "pointer", userSelect: "none", marginBottom: 6 }}
        onClick={function() { zoneRef.current && zoneRef.current.focus(); }}
        title="Cliquer puis Ctrl+V pour coller">
        {label}
        {items.length > 0 && <span style={{ color: GREEN, fontWeight: 600, marginLeft: 6 }}>({items.length})</span>}
        <span style={{ fontSize: 10, color: MUTED, fontWeight: 400, marginLeft: 6 }}>↵ coller</span>
      </div>

      {/* Drop zone */}
      <div
        ref={zoneRef}
        tabIndex={0}
        onPaste={handlePaste}
        onDragOver={function(e) { if (dragIdx === null && dragIdx !== 0) { e.preventDefault(); setDrag(true); } }}
        onDragLeave={function(e) { if (!zoneRef.current.contains(e.relatedTarget)) setDrag(false); }}
        onDrop={function(e) {
          if (dragIdx !== null) return;
          e.preventDefault(); setDrag(false);
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        }}
        style={{ border: "1.5px dashed " + (drag ? GREEN : BORDER), background: drag ? GREEN_LIGHT : BG, borderRadius: 8, padding: 8, minHeight: 60, outline: "none" }}
      >
        {/* Mobile buttons row */}
        {isMobile ? (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: items.length > 0 ? 8 : 0 }}>
            <button
              onClick={function() { refCamera.current && refCamera.current.click(); }}
              style={{ flex: 1, minWidth: 120, background: GREEN, color: WHITE, border: "none", borderRadius: 8, padding: "10px 12px", fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              📷 Appareil photo
            </button>
            <button

                <Field label={"Onduleur " + (i+1) + " — Type / Modèle"} value={ond.type} onChange={function(v){ setTech(function(p){ return Object.assign({}, p, { onduleurs: p.onduleurs.map(function(o,idx){ return idx===i ? Object.assign({},o,{type:v}) : o; }) }); }); }} placeholder="Ex: Deye SUN-8K" />
                <Field label="Puissance" value={ond.kva} onChange={function(v){ setTech(function(p){ return Object.assign({}, p, { onduleurs: p.onduleurs.map(function(o,idx){ return idx===i ? Object.assign({},o,{kva:v}) : o; }) }); }); }} type="number" unit="kVA" />
                {tech.onduleurs.length > 1 && <button onClick={function(){ setTech(function(p){ return Object.assign({}, p, { onduleurs: p.onduleurs.filter(function(_,idx){ return idx!==i; }) }); }); }} style={{ fontSize: 20, color: MUTED, background: "none", border: "none", cursor: "pointer", paddingBottom: 4 }}>×</button>}

                <Field label="Modèle" value={tech.batterie.type} onChange={function(v){ setT("batterie.type", v); }} placeholder="Ex: BYD HVM 11.0" />

              {tech.borne.inclus === "OUI" && <div style={{ display: "grid", gridTemplateColumns: "50px 1fr", gap: 6, marginTop: 6 }}>

                <Field label="Modèle" value={tech.borne.type} onChange={function(v){ setT("borne.type", v); }} placeholder="Ex: Wallbox Pulsar" />

                <Toggle value={tech.ems.inclus} onChange={function(v){ setT("ems.inclus", v); }} />
                {tech.ems.inclus === "OUI" && (

                    <option value="">— Choisir un EMS —</option>
                    {["Nexxtlab Smart Master Home", "Nexxtlab Smart Master Pro", "Huawei EMMA", "Eniris Home", "Autre"].map(function(o){ return <option key={o} value={o}>{o}</option>; })}
                  </select>
                )}
              </div>
            </div>
            <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 13 }}>Compteur vert</span><Toggle value={tech.compteurVert} onChange={function(v){ setT("compteurVert", v); }} /></div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 13 }}>Greenbox</span><Toggle value={tech.greenbox} onChange={function(v){ setT("greenbox", v); }} /></div>
            </div>
          </div>

          <Field label="Autres accessoires" value={tech.accessoires} onChange={function(v){ setT("accessoires", v); }} placeholder="Ex: Optimiseurs, câblage spécifique…" />

          <div><div style={SUBH}>Réseau électrique</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {["Monophasé 230V", "Triphasé 3×230V", "Triphasé 3×400+N"].map(function(r){ return <Chip key={r} label={r} selected={tech.reseau === r} onClick={function(){ setT("reseau", tech.reseau === r ? null : r); }} />; })}
            </div>
          </div>

          <div style={G2}>
            <Field label="Ampérage disjoncteur général ⚠" value={tech.amperageDisj} onChange={function(v){ setT("amperageDisj", v); }} type="number" unit="A" />
            <div />
          </div>

          <div style={G2}>
            <Field label="Compteur réseau — N° de série (optionnel)" value={tech.compteur.serie} onChange={function(v){ setT("compteur.serie", v); }} />
            <Field label="EAN (optionnel)" value={tech.compteur.ean} onChange={function(v){ setT("compteur.ean", v); }} />
          </div>

          <div><div style={SUBH}>Branchement de l'onduleur</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {["Sur le TGBT", "Sur un tableau divisionnaire"].map(function(b){ return <Chip key={b} label={b} selected={tech.branchementOnduleur === b} onClick={function(){ setT("branchementOnduleur", tech.branchementOnduleur === b ? null : b); }} />; })}
            </div>
          </div>

          <div><div style={SUBH}>Distances</div>
            <div style={G3}>
              <Field label="Onduleur → TGBT" value={tech.distances.onduleurTGBT} onChange={function(v){ setT("distances.onduleurTGBT", v); }} type="number" unit="m" />
              <Field label="Onduleur → Tableau div." value={tech.distances.onduleurTD} onChange={function(v){ setT("distances.onduleurTD", v); }} type="number" unit="m" />
              <Field label="Borne → TGBT" value={tech.distances.borneTGBT} onChange={function(v){ setT("distances.borneTGBT", v); }} type="number" unit="m" />
            </div>
          </div>

        </div>
      </div>

      {/* Strings card */}
      <div style={Object.assign({}, CARD, { marginTop: 10 })}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={SH}>Configuration de strings</div>
          <button onClick={function(){ onAddString(instIdx); }} style={{ fontSize: 12, color: GREEN, background: "none", border: "1px dashed " + GREEN_MID, borderRadius: 6, padding: "4px 12px", cursor: "pointer", marginBottom: 14 }}>+ Ajouter un string</button>
        </div>
        {strings.length === 0 && <div style={{ textAlign: "center", padding: "20px 0", fontSize: 13, color: "#aaa" }}>Aucun string — cliquez sur + Ajouter</div>}
        {strings.map(function(row, i) { return <StringRow key={i} idx={i} row={row} onChange={function(r){ onUpdString(instIdx, i, r); }} onRemove={function(){ onDelString(instIdx, i); }} maxOnd={Math.max(1, tech.onduleurs.length)} />; })}
        {strings.length > 0 && (
          <div style={{ marginTop: 12, padding: "8px 12px", background: GREEN_LIGHT, borderRadius: 6, fontSize: 12, color: MUTED }}>
            <strong style={{ color: TEXT }}>Résumé : </strong>
            {Object.entries(strings.reduce(function(acc, s, i) { var k = "Onduleur " + s.onduleur; if (!acc[k]) acc[k] = []; acc[k].push({ s: s, idx: i }); return acc; }, {})).map(function(e) { return e[0] + " → " + e[1].map(function(x){ return "STR"+(x.idx+1)+": "+(x.s.count||"?")+"×PV "+(x.s.orient==="Libre"?(x.s.orientLibre||"?"):(x.s.orient||"?")); }).join(", "); }).join("   |   ")}
          </div>
        )}
      </div>
    </div>
  );
}


function App() {
  const [mode, setMode] = useState("form");
  const [bcLoading, setBcLoading] = useState(false);
  const [bcDrag, setBcDrag] = useState(false);
  const [bcMsg, setBcMsg] = useState("");
  const [client, setClient] = useState({ nom: "", adresse: "", tel: "", email: "" });
  const [weGreen, setWeGreen] = useState({ manager: "", tel: "", email: "" });
  const [calepinage, setCalepinage] = useState({ image: null, loading: false, msg: "" });
  const [tdNote, setTdNote] = useState("");
  const [schemaNote, setSchemaNote] = useState("");
  const [date, setDate] = useState("");
  const [installations, setInstallations] = useState([makeEmptyInst()]);
  const [comments, setComments] = useState("");
  const [logistique, setLogistique] = useState({ parking: null, hauteurCorniche: "", hauteurToitPlat: "", inclinaisonRue: "", acces: null, autreAcces: "", tuileReserve: null, lift: null, nacelle: null, manitou: null, grue: null });

  const [photos, setPhotos] = useState(Object.fromEntries(PHOTO_CATS.map(c => [c.key, []])));

  const [ref, setRef] = useState("");
  const [saveStatus, setSaveStatus] = useState(""); // "", "saving", "saved", "error"
  const [lastSaved, setLastSaved] = useState(null);
  const saveTimer = useRef(null);
  const isLoading = useRef(false);

  const data = { client, weGreen, date, installations, comments, logistique, photos, calepinage, tdNote, schemaNote };

  // setT(instIdx, path, val) — updates tech field in installation instIdx
  const setT = function(instIdx, path, val) {
    setInstallations(function(prev) {
      var arr = JSON.parse(JSON.stringify(prev));
      var parts = path.split(".");
      var o = arr[instIdx].tech;
      for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
      o[parts[parts.length - 1]] = val;
      return arr;
    });
  };
  const setInstTech = function(instIdx, updater) {
    setInstallations(function(prev) {
      var arr = JSON.parse(JSON.stringify(prev));
      arr[instIdx].tech = updater(arr[instIdx].tech);
      return arr;
    });
  };

  // ── Load from URL ?ref= on mount ──────────────────────────────────────────
  useEffect(function() {
    var params = new URLSearchParams(window.location.search);
    var urlRef = params.get("ref");
    if (!urlRef) return;
    setRef(urlRef);
    setSaveStatus("loading");
    supaLoad(urlRef).then(function(row) {
      if (!row || !row.data) { setSaveStatus(""); return; }
      try {
        var d = row.data;
        isLoading.current = true;
        // Each field validated before applying - crash-safe
        if (d.client && typeof d.client === "object") setClient(function(p){ return Object.assign({}, p, d.client); });
        if (d.weGreen && typeof d.weGreen === "object") setWeGreen(function(p){ return Object.assign({}, p, d.weGreen); });
        if (typeof d.date === "string") setDate(d.date);
        // Rétrocompatibilité: ancien format (tech+strings) → installations[0]
        if (Array.isArray(d.installations) && d.installations.length > 0) {
          var safeInsts = d.installations.map(function(inst) {
            if (!inst || typeof inst !== "object") return makeEmptyInst();
            var base = makeEmptyInst();
            if (inst.tech && typeof inst.tech === "object") {
              base.tech = Object.assign({}, base.tech, inst.tech);
              if (inst.tech.panneaux) base.tech.panneaux = Object.assign({}, base.tech.panneaux, inst.tech.panneaux);
              if (inst.tech.toiture) base.tech.toiture = Object.assign({}, base.tech.toiture, inst.tech.toiture);
              if (inst.tech.batterie) base.tech.batterie = Object.assign({}, base.tech.batterie, inst.tech.batterie);
              if (inst.tech.borne) base.tech.borne = Object.assign({}, base.tech.borne, inst.tech.borne);
              if (inst.tech.ems) base.tech.ems = Object.assign({}, base.tech.ems, inst.tech.ems);
              if (inst.tech.compteur) base.tech.compteur = Object.assign({}, base.tech.compteur, inst.tech.compteur);
              if (inst.tech.distances) base.tech.distances = Object.assign({}, base.tech.distances, inst.tech.distances);
              if (Array.isArray(inst.tech.onduleurs) && inst.tech.onduleurs.length > 0) base.tech.onduleurs = inst.tech.onduleurs;
            }
            if (Array.isArray(inst.strings) && inst.strings.length > 0) base.strings = inst.strings;
            return base;
          });
          setInstallations(safeInsts);
        } else if (d.tech && typeof d.tech === "object") {
          // Migrate old format
          var migratedInst = makeEmptyInst();
          migratedInst.tech = Object.assign({}, migratedInst.tech, d.tech);
          if (d.tech.panneaux) migratedInst.tech.panneaux = Object.assign({}, migratedInst.tech.panneaux, d.tech.panneaux);
          if (d.tech.toiture) migratedInst.tech.toiture = Object.assign({}, migratedInst.tech.toiture, d.tech.toiture);
          if (d.tech.batterie) migratedInst.tech.batterie = Object.assign({}, migratedInst.tech.batterie, d.tech.batterie);
          if (d.tech.borne) migratedInst.tech.borne = Object.assign({}, migratedInst.tech.borne, d.tech.borne);
          if (d.tech.ems) migratedInst.tech.ems = Object.assign({}, migratedInst.tech.ems, d.tech.ems);
          if (d.tech.compteur) migratedInst.tech.compteur = Object.assign({}, migratedInst.tech.compteur, d.tech.compteur);
          if (d.tech.distances) migratedInst.tech.distances = Object.assign({}, migratedInst.tech.distances, d.tech.distances);
          if (Array.isArray(d.tech.onduleurs) && d.tech.onduleurs.length > 0) migratedInst.tech.onduleurs = d.tech.onduleurs;
          if (Array.isArray(d.strings) && d.strings.length > 0) migratedInst.strings = d.strings;
          setInstallations([migratedInst]);
        }
        if (typeof d.comments === "string") setComments(d.comments);
        if (d.logistique && typeof d.logistique === "object") setLogistique(function(p){ return Object.assign({}, p, d.logistique); });
        if (d.photos && typeof d.photos === "object") {
          var loadedPhotos = d.photos;
          var merged = Object.fromEntries(PHOTO_CATS.map(function(cat) {
            var arr = loadedPhotos[cat.key];
            return [cat.key, Array.isArray(arr) ? arr : []];
          }));
          setPhotos(merged);
        }
        if (typeof d.tdNote === "string") setTdNote(d.tdNote);
        if (typeof d.schemaNote === "string") setSchemaNote(d.schemaNote);
        if (d.calepinage && typeof d.calepinage === "object") setCalepinage(function(p){ return Object.assign({}, p, d.calepinage); });
        setLastSaved(row.updated_at);
        setSaveStatus("saved");
        setTimeout(function() { isLoading.current = false; }, 100);
      } catch(loadErr) {
        console.error("Erreur chargement Supabase:", loadErr);
        isLoading.current = false;
        setSaveStatus("");
      }
    });
  }, []);

  // ── Auto-save on any data change ───────────────────────────────────────────
  useEffect(function() {
    if (!ref || isLoading.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(function() {
      supaSave(ref, data).then(function(ok) {
        if (ok) { setLastSaved(new Date().toISOString()); setSaveStatus("saved"); }
        else setSaveStatus("error");
      });
    }, 1200);
  }, [client, weGreen, date, installations, comments, logistique, tdNote]);

  // ── Photos auto-save (separate, debounced longer due to size) ──────────────
  useEffect(function() {
    if (!ref || isLoading.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(function() {
      supaSave(ref, data).then(function(ok) {
        if (ok) { setLastSaved(new Date().toISOString()); setSaveStatus("saved"); }
        else setSaveStatus("error");
      });
    }, 2000);
  }, [photos, calepinage]);

  const parseBDC = async (file) => {
    setBcLoading(true); setBcMsg("");
    try {
      if (!file.type.includes("pdf")) {
        setBcMsg("Format PDF requis");
        setBcLoading(false); return;
      }
      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: ab }).promise;

      // ── Extract items with coordinates from all pages ──────────────────────
      var allItems = [];
      var pageWidths = [];
      for (var pg = 1; pg <= Math.min(pdf.numPages, 4); pg++) {
        var page = await pdf.getPage(pg);
        var vp = page.getViewport({ scale: 1 });
        pageWidths.push(vp.width);
        var tc = await page.getTextContent();
        for (var ti = 0; ti < tc.items.length; ti++) {
          var item = tc.items[ti];
          if (item.str.trim()) {
            allItems.push({ str: item.str.trim(), x: item.transform[4], y: vp.height - item.transform[5], page: pg, pw: vp.width });
          }
        }
      }

      // Sort: page asc, y asc, x asc
      allItems.sort(function(a, b) {
        if (a.page !== b.page) return a.page - b.page;
        if (Math.abs(a.y - b.y) >= 6) return a.y - b.y;
        return a.x - b.x;
      });

      // Group into lines (items within 5px vertically = same line)
      var lineGroups = [];
      for (var ii = 0; ii < allItems.length; ii++) {
        var it = allItems[ii];
        var last = lineGroups[lineGroups.length - 1];
        if (last && it.page === last.page && Math.abs(it.y - last.y) < 5) {
          last.items.push(it);
        } else {
          lineGroups.push({ y: it.y, page: it.page, pw: it.pw, items: [it] });
        }
      }

      // Build line objects with text + min/max x
      var lines = lineGroups.map(function(g) {
        var sorted = g.items.sort(function(a,b){ return a.x - b.x; });
        return {
          text: sorted.map(function(i){ return i.str; }).join(" ").trim(),
          minX: sorted[0].x,
          maxX: sorted[sorted.length-1].x,
          y: g.y,
          page: g.page,
          pw: g.pw,
          items: sorted
        };
      }).filter(function(l){ return l.text; });

      var r = {
        nom: "", adresse: "", manager: "", commande_ref: "",
        panneaux: [], onduleurs: [], batts: [], bornes: [], greenbox: false
      };

      // ── Commande ref ───────────────────────────────────────────────────────
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].text.match(/Commande\s*#\s*(S\d+)/i);
        if (m) { r.commande_ref = m[1]; break; }
      }

      // ── Vendeur ────────────────────────────────────────────────────────────
      for (var i = 0; i < lines.length; i++) {
        if (/^Vendeur\s*:/i.test(lines[i].text)) {
          var same = lines[i].text.replace(/^Vendeur\s*:\s*/i, "").trim();
          var nxt = lines[i+1] ? lines[i+1].text.trim() : "";
          var cand = same || nxt;
          if (cand && !/^We Green/i.test(cand)) {
            // Try exact match first, then partial match
            if (PM_DATA[cand]) {
              r.manager = cand;
            } else {
              // Try matching by first+last name fragments
              var candLower = cand.toLowerCase();
              var matched = Object.keys(PM_DATA).find(function(k) {
                return k.toLowerCase() === candLower ||
                       candLower.indexOf(k.toLowerCase()) >= 0 ||
                       k.toLowerCase().indexOf(candLower) >= 0;
              });
              r.manager = matched || cand;
            }
          }
          break;
        }
      }

      // ── Client extraction ─────────────────────────────────────────────────
      // Find index of "Commande #" line (header ends here)
      var cmdLineIdx = -1;
      for (var i = 0; i < lines.length; i++) {
        if (/Commande\s*#/i.test(lines[i].text)) { cmdLineIdx = i; break; }
      }
      var headerLines = cmdLineIdx >= 0 ? lines.slice(0, cmdLineIdx) : lines.slice(0, 20);

      var hasAddressBlock = headerLines.some(function(l){ return /Adresse de (facturation|livraison|exp)/i.test(l.text); });

      if (hasAddressBlock) {
        // Right column = items at x > 55% of page width → client contact
        var pw = headerLines[0] ? headerLines[0].pw : 595;
        var rightThreshold = pw * 0.52;
        var rightBlock = [];
        for (var i = 0; i < headerLines.length; i++) {
          var ln = headerLines[i];
          // Only count lines whose majority of text is in right column
          if (ln.minX > rightThreshold && !/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE)/i.test(ln.text)) {
            rightBlock.push(ln.text);
          }
        }
        // Filter out TVA/phone lines
        var filteredRight = rightBlock.filter(function(t){ return !/^(TVA|tel|fax|\+\d|BE\d{9})/i.test(t); });
        if (filteredRight.length >= 1 && !/^We Green/i.test(filteredRight[0])) {
          r.nom = filteredRight[0];
          if (filteredRight.length >= 2) r.adresse = filteredRight.slice(1).filter(function(t){ return !/^(TVA|Belgi)/i.test(t); }).join(", ");
        }

        // If right block is WGE or empty, fall back to shipping address
        if (!r.nom || /^We Green/i.test(r.nom)) {
          var shipIdx = -1;
          for (var i = 0; i < headerLines.length; i++) {
            if (/Adresse.{1,12}exp.{1,12}dition/i.test(headerLines[i].text)) { shipIdx = i; break; }
          }
          if (shipIdx >= 0) {
            var shipBlock = [];
            for (var i = shipIdx + 1; i < headerLines.length; i++) {
              var t = headerLines[i].text;
              if (/^Belgique$|^France$|^Pays-Bas$/i.test(t)) break;
              if (!/^(We Green|Ikaroslaan|Zaventem|Belgium|\+\d|n\.a\.)/i.test(t)) shipBlock.push(t);
            }
            if (shipBlock.length) {
              // Remove "CompanyName, ProjectName" prefix if present (like "Inclusio, SINT-NIKKLAS")
              var firstName = shipBlock[0].replace(/^[^,]+,\s*/, "").trim() || shipBlock[0];
              r.nom = firstName;
              if (shipBlock.length > 1) r.adresse = shipBlock.slice(1).join(", ");
            }
          }
        }
      } else {
        // Simple BDC: client block is in the RIGHT column (high X) of the header
        var pw2 = headerLines[0] ? headerLines[0].pw : 595;
        var rightThresh2 = pw2 * 0.50;
        var clientBlock = [];
        for (var i = 0; i < headerLines.length; i++) {
          var ln = headerLines[i];
          // Only right-column items
          if (ln.minX > rightThresh2) {
            var t = ln.text;
            if (/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE|02 476|IBAN|Energy Solutions)/i.test(t)) continue;
            clientBlock.push(t);
          }
        }
        // Fallback: if nothing found in right column, try all non-WGE lines
        if (clientBlock.length === 0) {
          for (var i = 0; i < headerLines.length; i++) {
            var t = headerLines[i].text;
            if (/^(We Green|Ikaroslaan|Zaventem|Belgium|TVA BE|02 476|IBAN|Energy Solutions)/i.test(t)) continue;
            clientBlock.push(t);
          }
        }
        // Remove trailing Belgique/France
        while (clientBlock.length && /^(Belgique|France|TVA)/i.test(clientBlock[clientBlock.length-1])) clientBlock.pop();
        if (clientBlock.length >= 1) r.nom = clientBlock[0];
        if (clientBlock.length >= 2) r.adresse = clientBlock.slice(1).join(", ");
      }

      // ── Scan product lines ─────────────────────────────────────────────────
      // Helper: extract qty from line text (first integer >= 1 followed by ,00 or .00)
      function extractQty(text) {
        var m = text.match(/\b(\d+)[,.]0+\b/g);
        if (!m) return 0;
        for (var q = 0; q < m.length; q++) {
          var n = parseInt(m[q]);
          if (n >= 1 && n <= 9999) return n;
        }
        return 0;
      }

      // Helper: extract wattage from text
      function extractWc(text) {
        var m = text.match(/\b(\d{3,4})[Ww](?:c|att|p)?(?:\s|$|-|\/)/);
        if (m) return m[1];
        // From model like "A445", "54HL4M-BDV 515", "460W"
        m = text.match(/\b(\d{3,4})[Ww]\b/);
        if (m) return m[1];
        // Model number like "-A445-" or " 515 "
        m = text.match(/[-\s]A?(\d{3,4})[-\s]/);
        if (m && parseInt(m[1]) >= 100 && parseInt(m[1]) <= 999) return m[1];
        return "";
      }

      for (var li = 0; li < lines.length; li++) {
        var t = lines[li].text;

        // Panneaux
        if (/^Panneaux\s*[-]\s*/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/^Panneaux\s*[-]\s*(.+)/i);
          if (nameMatch) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").replace(/\s*[-]\s*(Full Black|Neostar\S*|Half[- ]Cell)\s*$/, "").trim();
            var wc = extractWc(t);
            r.panneaux.push({ name: name, qty: qty, wc: wc });
          }
        }

        // Onduleurs (skip Optimiseur/Optimizer)
        if (/Onduleur\s*[-]/i.test(t) && !/Optimis[e|eu]ur|Optimizer/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/(?:\[[^\]]+\]\s*)?Onduleur\s*[-]\s*(.+)/i);
          if (nameMatch && qty > 0) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").replace(/\s*[-]\s*(Low Voltage|Three Phase|Hybrid|Mono\b|MONO\b|Single|TRI\b).*/i, "").trim();
            r.onduleurs.push({ type: name, qty: qty });
          }
        }
        // Onduleurs without "Onduleur -" prefix (like "Onduleur Deye SUN...")
        if (/^Onduleur\s+(?!.*Optimis)/i.test(t) && !/-\s*/i.test(t.substring(0,15))) {
          var qty = extractQty(t);
          var nameMatch = t.match(/^Onduleur\s+(.+)/i);
          if (nameMatch && qty > 0) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim();
            r.onduleurs.push({ type: name, qty: qty });
          }
        }

        // Batteries
        if (/^(?:\[[^\]]+\]\s*)?Batterie\s*[-]/i.test(t) && !/Chargeur|Power Module|recyclage/i.test(t)) {
          var qty = extractQty(t);
          var nameMatch = t.match(/Batterie\s*[-]\s*(.+)/i);
          if (nameMatch) {
            var name = nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim();
            var kwhM = t.match(/\b(\d+(?:[,.]\d+)?)\s*kWh/i) || nameMatch[1].match(/\b(\d+(?:[,.]\d+)?)\s*[kK][wW][hH]/i);
            var kwh = kwhM ? kwhM[1].replace(",",".") : "";
            r.batts.push({ name: name, qty: qty, kwh: kwh });
          }
        }

        // Bornes
        if (/^Borne\s/i.test(t)) {
          var qty = extractQty(t);
          if (qty > 0) {
            var nameMatch = t.match(/^Borne\s+[-\s]?\s*(.+)/i);
            var name = nameMatch ? nameMatch[1].replace(/\s+\d+[,.]0+.*$/, "").trim() : t;
            r.bornes.push({ type: name, qty: qty });
          }
        }

        // Greenbox
        if (/^Greenbox\s*(?:\d+[,.]|$)/i.test(t)) {
          r.greenbox = true;
        }
      }

      // ── Apply to state ─────────────────────────────────────────────────────
      if (r.nom || r.adresse) {
        setClient(function(p){ return Object.assign({}, p, { nom: r.nom || p.nom, adresse: r.adresse || p.adresse }); });
      }
      if (r.manager) {
        if (PM_DATA[r.manager]) {
          setWeGreen(function(p){ return Object.assign({}, p, { manager: r.manager, tel: PM_DATA[r.manager].tel, email: PM_DATA[r.manager].email }); });
        } else {
          setWeGreen(function(p){ return Object.assign({}, p, { manager: r.manager }); });
        }
      }

      setInstallations(function(prev) {
        var arr = JSON.parse(JSON.stringify(prev));
        var next = arr[0].tech;
        var next = JSON.parse(JSON.stringify(prev));

        // Panneaux: use first with highest qty
        var mainPan = null;
        for (var i = 0; i < r.panneaux.length; i++) {
          if (!mainPan || r.panneaux[i].qty > mainPan.qty) mainPan = r.panneaux[i];
        }
        if (mainPan) {
          next.panneaux.type = mainPan.name;
          next.panneaux.nbr = String(mainPan.qty || "");
          if (mainPan.wc && mainPan.qty) next.panneaux.kWc = (parseFloat(mainPan.qty) * parseFloat(mainPan.wc) / 1000).toFixed(2);
          else if (mainPan.wc === "" && mainPan.qty) {
            // Try extracting wc from name
            var wm = mainPan.name.match(/\b(\d{3,4})[Ww]/);
            if (wm) next.panneaux.kWc = (parseFloat(mainPan.qty) * parseFloat(wm[1]) / 1000).toFixed(2);
          }
        }

        // Onduleurs
        if (r.onduleurs.length > 0) {
          next.onduleurs = r.onduleurs.map(function(o){ return { type: o.type, kva: "" }; });
        }

        // Batterie
        var hasRealBatt = r.batts.some(function(b){ return b.qty > 0; });
        if (r.batts.length > 0) {
          var mainBatt = r.batts[0];
          // Find first with kWh info
          for (var i = 0; i < r.batts.length; i++) {
            if (r.batts[i].kwh) { mainBatt = r.batts[i]; break; }
          }
          if (hasRealBatt) {
            next.batterie.inclus = "OUI";
            if (mainBatt.kwh) next.batterie.kwh = mainBatt.kwh;
            if (mainBatt.name) next.batterie.type = mainBatt.name;
            // qty from first with qty > 0
            for (var i = 0; i < r.batts.length; i++) {
              if (r.batts[i].qty > 0) { next.batterie.qty = String(r.batts[i].qty); break; }
            }
          }
        }

        // Borne
        if (r.bornes.length > 0) {
          next.borne.inclus = "OUI";
          next.borne.type = r.bornes[0].type;
          next.borne.qty = String(r.bornes[0].qty);
        }

        // Greenbox
        if (r.greenbox) next.greenbox = "OUI";

        arr[0].tech = next;
        return arr;
      });

      var found = [
        r.nom && "client",
        r.adresse && "adresse",
        r.panneaux.some(function(p){ return p.qty > 0; }) && "panneaux (" + r.panneaux.reduce(function(s,p){ return s + p.qty; }, 0) + " pcs)",
        r.onduleurs.length && "onduleurs",
        r.batts.some(function(b){ return b.kwh; }) && "batterie",

        r.greenbox && "greenbox",
        r.manager && "PM"
      ].filter(Boolean);

      setBcMsg(found.length > 0
        ? "Extrait : " + found.join(" · ") + (r.commande_ref ? "  [" + r.commande_ref + "]" : "")
        : "Aucune donnee reconnue");
    } catch (e) {
      setBcMsg("Erreur : " + e.message);
    }
    setBcLoading(false);
  };


        const extractCalepinage = async (file) => {
    setCalepinage({ image: null, loading: true, msg: "" });
    try {
      // Helper: save url as calepinage + auto-add to strings_design
      const applyCalepinage = (url, msg) => {
        setCalepinage({ image: url, loading: false, msg: msg });
        setPhotos(prev => {
          var existing = prev.strings_design || [];
          // Remove old auto-calepinage then prepend new one
          var filtered = existing.filter(function(p) { return p.name !== "__calepinage__"; });
          return Object.assign({}, prev, { strings_design: [{ name: "__calepinage__", url: url, type: "image/jpeg" }].concat(filtered) });
        });
      };

      if (file.type.startsWith("image/")) {
        const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        applyCalepinage(url, "✓ Image chargée");
        return;
      }

      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      // Read all pages text first
      const pageTexts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const pg = await pdf.getPage(i);
        const tc = await pg.getTextContent();
        pageTexts.push(tc.items.map(function(it){ return it.str; }).join(" ").toLowerCase());
      }
      const allText = pageTexts.join(" ");

      // Detect report type
      const isHelioScope = /helioscope|aurora solar|detailed layout/i.test(allText);
      const isArchelios = /archelios|illustrations du projet/i.test(allText);

      let targetPage = pdf.numPages; // default: last page

      if (isHelioScope) {
        // Hélioscope: find "Detailed Layout" page
        for (let i = 1; i <= pdf.numPages; i++) {
          if (/detailed layout/i.test(pageTexts[i-1])) { targetPage = i; break; }
        }
      } else if (isArchelios) {
        // Archelios: find "Illustrations du projet" page
        for (let i = 1; i <= pdf.numPages; i++) {
          if (/illustrations du projet/i.test(pageTexts[i-1])) { targetPage = i; break; }
        }
      } else {
        // Generic: score pages, prefer layout/illustration pages, skip map pages
        let bestScore = -999; let bestPage = pdf.numPages;
        for (let i = 1; i <= pdf.numPages; i++) {
          const txt = pageTexts[i-1];
          let score = 0;
          if (/illustration|detailed layout|calepinage|layout plan/.test(txt)) score += 15;
          if (/toiture|roof|panneaux|string|mppt/.test(txt)) score += 5;
          if (/google|maps?|satellite|localisation|location|météo|meteo|irradiation/.test(txt)) score -= 20;
          if (score >= bestScore) { bestScore = score; bestPage = i; }
        }
        targetPage = bestPage;
      }

      // Render target page at high resolution
      const page = await pdf.getPage(targetPage);
      const viewport = page.getViewport({ scale: 2.5 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const calUrl = canvas.toDataURL("image/jpeg", 0.90);
      const type = isHelioScope ? "Hélioscope" : isArchelios ? "Archelios" : "PDF";
      applyCalepinage(calUrl, "✓ " + type + " — page " + targetPage + "/" + pdf.numPages);

    } catch (e) {
      setCalepinage({ image: null, loading: false, msg: "Erreur : " + e.message });
    }
  };

  const deletePhoto = (catKey, idx) => setPhotos(prev => ({ ...prev, [catKey]: prev[catKey].filter((_, i) => i !== idx) }));

            <div style={SH}>Photos</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(170px, 1fr))", gap: 12 }}>
              {PHOTO_CATS.map(({ key, label, hasNote, hiRes }) => <PhotoZone key={key} label={label} items={photos[key] || []} onAdd={items => addPhotos(key, items)} onDelete={idx => deletePhoto(key, idx)} onUpdate={(idx, url) => updatePhoto(key, idx, url)} onReorder={(from, to) => reorderPhoto(key, from, to)} hasNote={hasNote} note={key === "td" || key === "schema_elec" ? (key === "td" ? tdNote : schemaNote) : ""} onNoteChange={v => key === "td" ? setTdNote(v) : setSchemaNote(v)} hiRes={!!hiRes} />)}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
